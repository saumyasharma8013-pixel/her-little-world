
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Her Little World ♡</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8eaf0;font-family:Georgia,serif;color:#604d5b}
#scene{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;top:13px;left:50%;transform:translateX(-50%);text-align:center;width:90%;pointer-events:none}
#top h1{font-size:clamp(20px,4vw,30px);margin:0;color:#76536b}
#top p{font:12px Arial;margin:5px;color:#8d7185}
#message{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,86vw);padding:24px 22px;background:#fff8fc;border:2px solid #edcddd;border-radius:22px;text-align:center;box-shadow:0 12px 35px #77546b40;z-index:5}
#message h2{font-size:21px;margin:0 0 10px;color:#986c88}
#message p{font:14px/1.6 Arial;margin:0 0 16px}
button{border:0;border-radius:22px;padding:10px 20px;background:#dcaec8;color:white;font-weight:bold;cursor:pointer}
#hint{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);background:#fff9fccc;padding:9px 15px;border-radius:20px;font:11px Arial;color:#856d7e;white-space:nowrap;pointer-events:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f8eaf0;z-index:10;color:#8e6a83}
#home{position:fixed;right:12px;top:13px;background:#fff9f0;color:#916c83;border:1px solid #e9cbdc;padding:9px 13px;font-size:12px}
@media(max-width:600px){#top{top:12px}#top p{font-size:10px}#hint{font-size:10px;bottom:10px}}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="scene"></div>
<div id="loading"><span>Building her little world... ♡</span></div>
<div id="top"><h1>Her Little World ♡</h1><p>A tiny universe made just for you</p></div>
<button id="home">⌂ View whole house</button>
<div id="message"><h2 id="msgTitle">A little surprise ♡</h2><p id="msgText"></p><button id="close">Close ♡</button></div>
<div id="hint">Drag to look around · Pinch to zoom · Tap objects for surprises</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color('#f8eaf0');
scene.fog=new THREE.Fog('#f8eaf0',38,85);

const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,150);
camera.position.set(23,24,29);

const renderer=new THREE.WebGLRenderer({antialias:innerWidth>700,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.25:1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.getElementById('scene').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.07;
controls.target.set(0,1,2);
controls.minDistance=12;
controls.maxDistance=58;
controls.maxPolarAngle=Math.PI/2.05;
controls.minPolarAngle=.25;

scene.add(new THREE.HemisphereLight('#fff5fa','#a68b9d',2));
const sun=new THREE.DirectionalLight('#fff3df',2.5);
sun.position.set(-12,24,14);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-25;
sun.shadow.camera.right=25;
sun.shadow.camera.top=25;
sun.shadow.camera.bottom=-25;
scene.add(sun);

const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
const M={
wall:mat('#fff4e9'),pink:mat('#e9c5d4'),pink2:mat('#dbaec4'),
floor:mat('#d9bba6'),wood:mat('#b98770'),wood2:mat('#d2a58d'),
cream:mat('#fff0d9'),white:mat('#fffaf3'),lilac:mat('#c9b9df'),
purple:mat('#9b83b7'),blue:mat('#b6d1dc'),mint:mat('#b7d4c1'),
green:mat('#799d7d'),yellow:mat('#f2d58e'),red:mat('#d98d91'),
dark:mat('#554b5c'),black:mat('#39333f'),grey:mat('#b7afb6'),
carpet:mat('#e8c8d7'),carpet2:mat('#c9badb')
};

const clickable=[];
const cats=[];
const clock=new THREE.Clock();

function box(parent,x,y,z,w,h,d,material,info=null,rot=0){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 mesh.rotation.y=rot;
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 if(info){mesh.userData.info=info;clickable.push(mesh);}
 return mesh;
}
function sphere(parent,x,y,z,r,material,info=null){
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),material);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 parent.add(mesh);
 if(info){mesh.userData.info=info;clickable.push(mesh);}
 return mesh;
}
function cyl(parent,x,y,z,r1,r2,h,material,info=null){
 const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,16),material);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 parent.add(mesh);
 if(info){mesh.userData.info=info;clickable.push(mesh);}
 return mesh;
}
function carpet(x,z,w,d,material=M.carpet){box(scene,x,.045,z,w,.08,d,material)}
function wall(x,y,z,w,h,d,material=M.wall){box(scene,x,y,z,w,h,d,material)}
function label(text,x,y,z){
 const canvas=document.createElement('canvas');
 canvas.width=512;canvas.height=128;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='rgba(255,248,252,.96)';
 ctx.beginPath();ctx.roundRect(8,8,496,112,30);ctx.fill();
 ctx.strokeStyle='#e7c4d7';ctx.lineWidth=5;ctx.stroke();
 ctx.fillStyle='#76556d';ctx.font='bold 38px Georgia';ctx.textAlign='center';
 ctx.fillText(text,256,79);
 const texture=new THREE.CanvasTexture(canvas);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true}));
 sprite.position.set(x,y,z);sprite.scale.set(4.5,1.12,1);scene.add(sprite);
}

// Main platform
box(scene,0,-.38,1,22,.55,15,mat('#e7cbd5'));
box(scene,0,-.08,1,20,.18,13,M.cream);

// Room floors
carpet(-5,-2.5,9.6,6.1,mat('#eacbd7'));
carpet(5,-2.5,9.6,6.1,mat('#d5c8e9'));
carpet(-5,4.5,9.6,6.1,mat('#c9dfd0'));
carpet(5,4.5,9.6,6.1,mat('#f0d9b5'));

// Outer walls
wall(-10,1.55,-2.5,.25,3.1,7.2);
wall(10,1.55,-2.5,.25,3.1,7.2);
wall(0,1.55,-6.1,20,.25,.25);
wall(-10,1.55,4.5,.25,3.1,6);
wall(10,1.55,4.5,.25,3.1,6);
wall(-5,1.55,7.5,10,.25,.25);
wall(5,1.55,7.5,10,.25,.25);

// Internal walls
wall(-5,1.55,1.15,9.8,.22,.22);
wall(5,1.55,1.15,9.8,.22,.22);
wall(0,1.55,-3.9,.22,3.1,4.3);
wall(0,1.55,5.25,.22,3.1,4.5);

// Wall top trim
wall(0,3.12,-6.1,20,.12,.32,M.pink2);
wall(-10,3.12,.5,.32,.12,13,M.pink2);
wall(10,3.12,.5,.32,.12,13,M.pink2);

// Windows
function windowAt(x,y,z,w=2.2){
 const glass=new THREE.MeshStandardMaterial({color:'#b8dbe6',transparent:true,opacity:.65});
 box(scene,x,y,z,w,1.25,.06,glass);
 box(scene,x,y,z,w,.1,.12,M.white);
 box(scene,x,y,z,.09,1.3,.12,M.white);
}
windowAt(-5,1.85,-6,3);
windowAt(5,1.85,-6,3);
windowAt(-10,1.85,-2.5,2.3);
windowAt(10,1.85,4.5,2.3);

// Room names
label('COMFORT ZONE',-5,3.35,-2.5);
label('SOUND LAB',5,3.35,-2.5);
label('CAT HQ',-5,3.35,4.5);
label('CHAOS DEN',5,3.35,4.5);

// Bedroom
carpet(-5,-2.6,5.8,3.7,M.carpet);
box(scene,-5,.55,-3.6,3.5,.65,2.5,M.wood2,{title:'Your safe little corner',text:'A room for slow mornings, soft blankets and feeling at home. ♡'});
box(scene,-5,.95,-3.6,3.35,.25,2.35,M.white);
box(scene,-5,1.18,-4.45,3.25,.45,.55,M.pink);
box(scene,-6,1.1,-4.2,.75,.2,.65,M.white);
box(scene,-4,1.1,-4.2,.75,.2,.65,M.white);
box(scene,-7.8,.9,-3.3,1,1.8,1.2,M.wood,{title:'A little wardrobe',text:'All the versions of you get a place here. Even the ones still figuring things out.'});
box(scene,-7.8,1.85,-3.3,1.05,.12,1.25,M.cream);
cyl(scene,-3.1,1.1,-3.4,.38,.38,.16,M.wood,{title:'Bedside lamp',text:'A little light for every late-night thought.'});
cyl(scene,-3.1,1.55,-3.4,.23,.12,.45,M.yellow);
box(scene,-3.1,.55,-1.2,1.2,.8,.8,M.wood,{title:'Bedside table',text:'A tiny place for all the little things you love.'});
box(scene,-3.1,1.05,-1.2,.95,.12,.65,M.cream);
box(scene,-5,1.7,-5.94,2.2,1.15,.12,M.pink2,{title:'A reminder',text:'You deserve a space where you never have to pretend to be anything other than yourself.'});

// Music room
carpet(5,-2.5,7.5,4.5,M.carpet2);
box(scene,5,.55,-5,4.2,.9,1,M.wood,{title:'Music console',text:'For every song that says what words cannot. Turn it up. ♡'});
box(scene,5,1.05,-5,3.8,.12,.8,M.dark);
for(const x of [3.4,6.6]){
 box(scene,x,1.1,-5,.55,.6,.45,M.black,{title:'Speaker',text:'A little louder, please. This is the soundtrack of your life.'});
 sphere(scene,x,1.1,-4.74,.16,M.grey);
}
cyl(scene,5,1.22,-5,.75,.75,.15,M.dark,{title:'Record player',text:'Some things are better on repeat. Like your favourite songs.'});
cyl(scene,5,1.34,-5,.48,.48,.035,M.grey);
cyl(scene,5.2,1.38,-5,.07,.07,.05,M.yellow);
box(scene,7.7,.8,-2.2,2,.9,1,M.purple,{title:'The listening sofa',text:'A designated spot for listening to music and ignoring the world for a while.'});
box(scene,7.7,1.25,-2.2,2,.2,1,M.lilac);
box(scene,3,.75,-2.1,.45,1.5,.5,M.wood2,{title:'Guitar corner',text:'For all the feelings that need a melody.'},-.2);
box(scene,3,1.6,-2.1,.65,.2,.65,M.wood2);
box(scene,5,2.1,-5.93,2.5,1,.12,M.purple,{title:'Your soundtrack',text:'May your life always have a song for every season.'});

// Cat HQ
carpet(-5,4.5,7.5,4.5,M.mint);
box(scene,-7.5,.4,4.2,1.5,.55,1.4,M.pink,{title:'Cat nap station',text:'Official headquarters for tiny paws and very important naps.'});
box(scene,-7.5,.72,4.2,1.3,.15,1.2,M.white);
cyl(scene,-3.1,1,4.2,.24,.24,1.7,M.wood,{title:'Scratching post',text:'A very important piece of furniture. The sofa is not for scratching. Allegedly.'});
cyl(scene,-3.1,1.9,4.2,.65,.65,.15,M.pink);
cyl(scene,-6.5,.25,6.1,.38,.38,.12,M.grey,{title:'Food bowl',text:'The most important meeting of the day.'});
cyl(scene,-5.4,.25,6.1,.38,.38,.12,M.blue,{title:'Water bowl',text:'Hydration is important, even for tiny supervisors.'});
sphere(scene,-4.3,.3,5.8,.3,M.yellow,{title:'Cat toy',text:'A suspiciously small object that will cause a suspiciously large amount of chaos.'});
box(scene,-5,1.9,1.6,2.6,1.1,.12,M.green,{title:'Cat HQ noticeboard',text:'Rules: naps are mandatory, treats are a right, and humans are staff.'});

// Chaos den
carpet(5,4.5,7.5,4.5,M.cream);
box(scene,5,.55,2.1,3.5,.75,1.3,M.wood,{title:'The command centre',text:'For ambitious plans, 2 a.m. thoughts and tabs that will never be closed.'});
box(scene,5,1.05,2,1.4,.9,.12,M.dark,{title:'Laptop',text:'Currently running on 47 open tabs and pure determination.'});
box(scene,5,1.55,2,1.2,.75,.06,M.blue);
box(scene,3.1,.9,2.1,.55,.35,.55,M.pink,{title:'A stack of books',text:'A little knowledge, a little chaos, and a lot of bookmarks.'});
box(scene,3.1,1.15,2.1,.55,.12,.55,M.cream);
box(scene,7.4,.6,5.5,1.7,.7,1.5,M.purple,{title:'The chaos beanbag',text:'A soft landing place for all the beautifully chaotic thoughts.'});
sphere(scene,7.4,.9,5.5,.55,M.lilac);
box(scene,6,.3,6.3,.8,.12,.7,M.pink,{title:'Mystery object',text:'Nobody knows what this is. It has been here for months. We respect it.'});
box(scene,5,2,1.05,2.8,1.1,.12,M.pink2,{title:'The wall of ideas',text:'Dream big. Make weird things. Never apologise for being a little too much.'});

// Rooftop
box(scene,0,-.05,10.8,19,.25,6.2,mat('#dfc8e2'),{title:'Birthday rooftop',text:'The best place in the whole little world. This one is for celebrating you. Happy birthday!'});
box(scene,0,.12,10.8,18.7,.08,5.9,M.pink);
for(const x of [-8.8,8.8])box(scene,x,.65,10.8,.18,1.2,5.8,M.white);
for(const z of [8,13.6])box(scene,0,.65,z,17.6,1.2,.18,M.white);
cyl(scene,0,.75,10.7,1.5,1.5,.22,M.white,{title:'Birthday cake',text:'One more candle, one more year of being wonderfully, ridiculously you. Make a wish!'});
cyl(scene,0,1.15,10.7,.9,.9,.65,M.pink);
cyl(scene,0,1.52,10.7,.75,.75,.15,M.cream);
sphere(scene,0,1.85,10.7,.22,M.yellow);
box(scene,-5,.55,10.6,2.6,.7,1.2,M.purple,{title:'Party sofa',text:'Reserved for the birthday girl and her favourite people.'});
box(scene,-5,.95,10.6,2.6,.18,1.2,M.lilac);
box(scene,5,.5,10.6,2,.6,1.1,M.wood,{title:'Gift table',text:'A few little surprises, wrapped with an unreasonable amount of love.'});
for(const x of [-7,-6,6,7]){
 cyl(scene,x,.9,12.2,.12,.12,1.2,M.pink2);
 sphere(scene,x,1.65,12.2,.38,M.yellow);
}

// Staircase
for(let i=0;i<7;i++)box(scene,-8+i*.35,.12+i*.12,7.7+i*.45,2.2,.18,.55,M.wood2);

// Plants
function plant(x,z){
 cyl(scene,x,.3,z,.42,.34,.6,M.pink2);
 cyl(scene,x,.65,z,.07,.07,.8,M.wood);
 for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5;
  const leaf=sphere(scene,x+Math.cos(a)*.28,1,z+Math.sin(a)*.28,.23,M.green);
  leaf.scale.set(.7,1.5,.7);
 }
}
plant(-9,-5.1);plant(9,-5.1);plant(-9,6.5);plant(9,6.5);
plant(-8,12);plant(8,12);

// Cats
function makeCat(x,z,color,name){
 const g=new THREE.Group();
 g.position.set(x,.12,z);
 scene.add(g);
 const fur=mat(color);
 const body=sphere(g,0,.42,0,.48,fur,{title:name,text:'A tiny furry resident of this little world. Tap around to discover more surprises. ♡'});
 body.scale.set(1.35,.8,.85);
 sphere(g,.38,.77,0,.34,fur);
 for(const s of [-1,1]){
  const ear=new THREE.Mesh(new THREE.ConeGeometry(.15,.34,4),fur);
  ear.position.set(.22+s*.2,1.08,s*.2);
  g.add(ear);
  sphere(g,.51,.8,s*.13,.045,M.dark);
 }
 const tail=new THREE.Mesh(new THREE.TorusGeometry(.32,.07,6,12,Math.PI),fur);
 tail.position.set(-.48,.58,0);
 tail.rotation.z=Math.PI/2;
 g.add(tail);
 cats.push({g,x,z,phase:Math.random()*6});
}
makeCat(-6.3,4.8,'#f0e0d1','Mochi');
makeCat(-4,5.7,'#77717b','The tiny supervisor');
makeCat(6.7,4.4,'#e5b98d','The chaos agent');

// Hidden stars
sphere(scene,-8.3,-.02,-.2,.23,M.yellow,{title:'Hidden little star',text:'You found a tiny star! A reminder that even the smallest things can make a world feel magical.'});
sphere(scene,8.2,-.02,-.3,.23,M.pink2,{title:'Another little star',text:'Another hidden sparkle. Keep exploring, there are more surprises around here.'});
sphere(scene,8.3,-.02,6.8,.23,M.lilac,{title:'Secret sparkle',text:'A little secret just for you. You make ordinary days feel special.'});

// Raycasting: detect clicks on furniture
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{
 if(Math.abs(e.clientX-downX)>8||Math.abs(e.clientY-downY)>8)return;
 pointer.x=e.clientX/innerWidth*2-1;
 pointer.y=-(e.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(clickable,true);
 for(const hit of hits){
  let obj=hit.object;
  while(obj&&!obj.userData.info)obj=obj.parent;
  if(obj&&obj.userData.info){
   document.getElementById('msgTitle').textContent=obj.userData.info.title;
   document.getElementById('msgText').textContent=obj.userData.info.text;
   document.getElementById('message').style.display='block';
   break;
  }
 }
});
document.getElementById('close').onclick=()=>document.getElementById('message').style.display='none';
document.getElementById('home').onclick=()=>{
 camera.position.set(23,24,29);
 controls.target.set(0,1,2);
 controls.update();
 document.getElementById('message').style.display='none';
};

// Responsive resize
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.25:1.7));
 renderer.setSize(innerWidth,innerHeight);
});

// Animation
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 cats.forEach(cat=>{
  cat.g.position.x=cat.x+Math.sin(t*.55+cat.phase)*.65;
  cat.g.position.z=cat.z+Math.cos(t*.45+cat.phase)*.45;
  cat.g.rotation.y=Math.sin(t*.55+cat.phase)*.3;
  cat.g.position.y=.12+Math.abs(Math.sin(t*2+cat.phase))*.07;
 });
 controls.update();
 renderer.render(scene,camera);
}
try{
 animate();
 document.getElementById('loading').style.display='none';
}catch(error){
 document.getElementById('loading').innerHTML='<span>Something went wrong loading the house. Please refresh. ♡</span>';
 console.error(error);
}
</script>
</body>
</html>
