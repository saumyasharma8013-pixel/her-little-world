
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Her Little World ♡</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#f8eaf0;color:#76566c;font-family:Georgia,serif}
#scene{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#header{position:fixed;top:12px;left:0;width:100%;text-align:center;pointer-events:none;z-index:2}
#header h1{font-size:clamp(21px,4vw,30px);margin:0;color:#805c76;text-shadow:0 2px 8px white}
#header p{font:11px Arial;color:#967b8d;margin:5px}
#rooms{position:fixed;top:78px;left:50%;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:96%;z-index:3}
#rooms button{font:11px Arial;padding:8px 10px;background:#fff8f3;color:#86677d;border:1px solid #e8cbd9;box-shadow:0 2px 8px #80566c18}
#rooms button.active{background:#d9b4c9;color:white}
#home{position:fixed;right:12px;bottom:55px;z-index:3;background:#fff8f3;color:#86677d;border:1px solid #e8cbd9;font-size:11px}
#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff8f0dd;padding:8px 13px;border-radius:20px;font:10px Arial;color:#8a7180;z-index:2}
#modal{display:none;position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(350px,88vw);max-height:75vh;overflow:auto;background:#fff9f4;border:2px solid #e8c9d8;border-radius:22px;padding:24px;text-align:center;box-shadow:0 15px 50px #573b553d}
#modal h2{font-size:22px;color:#986d88;margin:0 0 12px}
#modal p{font:14px/1.65 Arial;color:#75616e;margin:0 0 18px}
#modal button{background:#d6aec5;color:white;padding:10px 22px;border:0;border-radius:20px}
#loading{position:fixed;inset:0;z-index:10;background:#f8eaf0;display:grid;place-items:center;text-align:center;padding:25px;color:#916f85;font-size:18px}
#error{font:12px/1.5 Arial;overflow-wrap:anywhere}
@media(max-width:500px){
 #rooms{top:73px;gap:4px}
 #rooms button{padding:7px 8px;font-size:10px}
 #hint{font-size:9px}
}
</style>
</head>

<body>
<div id="scene"></div>

<div id="loading">
  <div>
    <div style="font-size:30px;margin-bottom:12px">♡</div>
    Building her little world...
    <div id="error"></div>
  </div>
</div>

<div id="header">
  <h1>Her Little World ♡</h1>
  <p>A tiny universe made just for you</p>
</div>

<div id="rooms">
  <button data-room="all" class="active">Whole house</button>
  <button data-room="bedroom">Bedroom</button>
  <button data-room="music">Music room</button>
  <button data-room="cats">Cat HQ</button>
  <button data-room="chaos">Chaos den</button>
  <button data-room="roof">Rooftop</button>
</div>

<button id="home">⌂ Reset view</button>
<div id="hint">Drag to look around · Pinch to zoom · Tap objects to explore</div>

<div id="modal">
  <h2 id="modalTitle">A little surprise ♡</h2>
  <p id="modalText"></p>
  <button id="modalClose">Close ♡</button>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const loading=document.getElementById('loading');
const errorBox=document.getElementById('error');

function showError(error){
  console.error(error);
  loading.style.display='grid';
  errorBox.textContent='The house could not load: '+(error?.message||error);
}

try{

// --------------------------------------------------
// SCENE, CAMERA AND LIGHTING
// --------------------------------------------------

const scene=new THREE.Scene();
scene.background=new THREE.Color('#f8eaf0');
scene.fog=new THREE.Fog('#f8eaf0',48,100);

const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,180);
camera.position.set(23,25,30);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.getElementById('scene').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.065;
controls.target.set(0,1,2);
controls.minDistance=11;
controls.maxDistance=55;
controls.maxPolarAngle=Math.PI/2.04;
controls.minPolarAngle=.22;

scene.add(new THREE.HemisphereLight('#fff8f4','#a28ba2',2.1));

const sunlight=new THREE.DirectionalLight('#fff0dc',2.6);
sunlight.position.set(-14,25,16);
sunlight.castShadow=true;
sunlight.shadow.mapSize.set(1536,1536);
sunlight.shadow.camera.left=-25;
sunlight.shadow.camera.right=25;
sunlight.shadow.camera.top=25;
sunlight.shadow.camera.bottom=-25;
scene.add(sunlight);

const fill=new THREE.DirectionalLight('#e9dfff',.8);
fill.position.set(15,12,-10);
scene.add(fill);

// --------------------------------------------------
// MATERIALS AND BUILDING HELPERS
// --------------------------------------------------

const material=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});

const C={
  cream:material('#fff2df'),
  white:material('#fffaf5'),
  blush:material('#eac5d5'),
  rose:material('#d9a9c0'),
  pink:material('#f1d5df'),
  mauve:material('#a982a0'),
  lilac:material('#c9b9df'),
  lavender:material('#a99acb'),
  mint:material('#c6dfd0'),
  sage:material('#8da98c'),
  blue:material('#bfd9e5'),
  sky:material('#d8e8ed'),
  wood:material('#bd9277'),
  oak:material('#d6b092'),
  darkWood:material('#89634f'),
  gold:material('#e5c27b'),
  charcoal:material('#554c5a'),
  black:material('#39343e'),
  grey:material('#b8afb6'),
  rug:material('#e9cad9'),
  rug2:material('#d4c6e6'),
  grass:material('#a8c4a0')
};

const clickable=[];
const cats=[];
const clock=new THREE.Clock();
const visited=new Set();

function box(parent,x,y,z,w,h,d,mat,info=null,rotation=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  m.rotation.y=rotation;
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  if(info){m.userData.info=info;clickable.push(m);}
  return m;
}

function ball(parent,x,y,z,r,mat,info=null){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat);
  m.position.set(x,y,z);
  m.castShadow=true;
  parent.add(m);
  if(info){m.userData.info=info;clickable.push(m);}
  return m;
}

function cylinder(parent,x,y,z,r1,r2,h,mat,info=null){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,20),mat);
  m.position.set(x,y,z);
  m.castShadow=true;
  parent.add(m);
  if(info){m.userData.info=info;clickable.push(m);}
  return m;
}

function group(parent,x=0,y=0,z=0){
  const g=new THREE.Group();
  g.position.set(x,y,z);
  parent.add(g);
  return g;
}

function rug(x,z,w,d,mat){
  box(scene,x,.04,z,w,.08,d,mat);
}

function wall(x,y,z,w,h,d,mat=C.cream){
  box(scene,x,y,z,w,h,d,mat);
}

function textLabel(text,x,y,z){
  const c=document.createElement('canvas');
  c.width=512;c.height=128;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff8f1';
  ctx.beginPath();ctx.roundRect(8,8,496,112,28);ctx.fill();
  ctx.strokeStyle='#e7c4d5';ctx.lineWidth=5;ctx.stroke();
  ctx.fillStyle='#805d77';
  ctx.font='bold 36px Georgia';
  ctx.textAlign='center';
  ctx.fillText(text,256,78);
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  sprite.position.set(x,y,z);
  sprite.scale.set(4.2,1.05,1);
  scene.add(sprite);
}

// --------------------------------------------------
// HOUSE FOUNDATION AND ROOM FLOORS
// --------------------------------------------------

box(scene,0,-.42,.5,21,.55,15.5,material('#dfc3cf'));
box(scene,0,-.12,.5,20.5,.14,15,C.cream);

// Four rooms
rug(-5,-3,9.8,6.3,C.blush);
rug(5,-3,9.8,6.3,C.lilac);
rug(-5,4,9.8,6.3,C.mint);
rug(5,4,9.8,6.3,material('#f1dfc5'));

// Outer walls: open front for dollhouse cutaway
wall(0,1.65,-6.5,20.5,3.3,.3);
wall(-10,1.65,-.0,.3,3.3,13);
wall(10,1.65,-.0,.3,3.3,13);

// Front low decorative walls
wall(-5,.65,6.5,9.8,1.3,.25,C.pink);
wall(5,.65,6.5,9.8,1.3,.25,C.pink);

// Internal dividers, with doorway gaps
wall(-5,1.35,.1,9.7,2.7,.22,C.white);
wall(5,1.35,.1,9.7,2.7,.22,C.white);
wall(0,1.35,-5.0,.22,2.7,3.0,C.white);
wall(0,1.35,-1.2,.22,2.7,1.4,C.white);
wall(0,1.35,3.1,.22,2.7,2.1,C.white);
wall(0,1.35,6.0,.22,2.7,1.0,C.white);

// Wall caps
wall(0,3.05,-6.5,20.5,.14,.38,C.rose);
wall(-10,3.05,0,.38,.14,13,C.rose);
wall(10,3.05,0,.38,.14,13,C.rose);

// Windows
function makeWindow(x,y,z,w){
  const glass=new THREE.MeshStandardMaterial({
    color:'#b7dce7',transparent:true,opacity:.58,roughness:.2
  });
  box(scene,x,y,z,w,1.5,.07,glass);
  box(scene,x,y+.78,z,w,.1,.13,C.white);
  box(scene,x,y-.78,z,w,.1,.13,C.white);
  box(scene,x-w/2,y,z,.1,1.6,.13,C.white);
  box(scene,x+w/2,y,z,.1,1.6,.13,C.white);
  box(scene,x,y,z,.08,1.5,.15,C.white);
}
makeWindow(-5,1.9,-6.32,3.2);
makeWindow(5,1.9,-6.32,3.2);

// Room signs
textLabel('COMFORT ZONE',-5,3.25,-3);
textLabel('SOUND LAB',5,3.25,-3);
textLabel('CAT HQ',-5,3.25,4);
textLabel('CHAOS DEN',5,3.25,4);

// --------------------------------------------------
// BEDROOM: BED, BEDDING, WARDROBE, DRESSER
// --------------------------------------------------

rug(-5,-3,6.5,4.6,C.rug);

// Bed frame and mattress
box(scene,-5,.55,-4.2,3.6,.55,2.7,C.wood,{
 title:'Your safe little corner',
 text:'A room for slow mornings, soft blankets and feeling at home. You deserve a space where you can simply be.'
});
box(scene,-5,.9,-4.2,3.45,.25,2.55,C.white);
box(scene,-5,1.08,-3.55,3.35,.22,1.2,C.pink);
box(scene,-6.1,1.16,-4.9,.85,.23,.75,C.white);
box(scene,-4.0,1.16,-4.9,.85,.23,.75,C.white);
box(scene,-5,1.23,-4.05,3.2,.12,1.05,C.cream);

// Bedside tables
for(const x of [-7.8,-2.2]){
  box(scene,x,.55,-4.1,1,.85,.9,C.oak,{title:'Bedside table',text:'A little place for all the things that make a space feel like yours.'});
  box(scene,x,1.02,-4.1,1.02,.1,.92,C.cream);
  cylinder(scene,x,1.28,-4.1,.25,.3,.4,C.gold);
  ball(scene,x,1.55,-4.1,.24,C.pink);
}

// Wardrobe with doors
box(scene,-8.1,1.3,-1.8,1.25,2.6,.8,C.wood,{
 title:'The wardrobe',
 text:'Every version of you belongs here. Even the ones still figuring things out.'
});
box(scene,-8.1,1.3,-1.34,.55,2.45,.06,C.oak);
box(scene,-7.55,1.3,-1.34,.55,2.45,.06,C.oak);
ball(scene,-7.8,1.3,-1.25,.07,C.gold);
ball(scene,-8.35,1.3,-1.25,.07,C.gold);

// Dresser and mirror
box(scene,-2.0,.7,-1.5,1.5,1.3,.65,C.wood,{
 title:'A little reminder',
 text:'You do not need to have everything figured out to be doing beautifully.'
});
box(scene,-2,1.42,-1.5,1.5,.12,.68,C.cream);
box(scene,-2,2.0,-1.8,.85,.95,.12,C.mauve);
box(scene,-2,2.0,-1.72,.68,.78,.04,C.sky);

// Bedroom plant
cylinder(scene,-8.6,.35,-5.5,.38,.32,.65,C.rose);
cylinder(scene,-8.6,.9,-5.5,.06,.06,.8,C.wood);
for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5;
  const leaf=ball(scene,-8.6+Math.cos(a)*.3,1.25,-5.5+Math.sin(a)*.3,.23,C.sage);
  leaf.scale.set(.7,1.4,.7);
}

// --------------------------------------------------
// MUSIC ROOM: RECORD PLAYER, SPEAKERS, SOFA, GUITAR
// --------------------------------------------------

rug(5,-3,8,4.8,C.rug2);

// Console
box(scene,5,.55,-5.1,4.4,.85,1.15,C.wood,{
 title:'The music console',
 text:'For every song that says what words cannot. Keep finding music that feels like you.'
});
box(scene,5,1.02,-5.1,4.1,.12,1.0,C.dark);

// Record player
box(scene,5,1.25,-5.1,1.7,.28,1.4,C.charcoal,{
 title:'The record player',
 text:'Some things are better on repeat. Like favourite songs and the memories attached to them.'
});
cylinder(scene,5,1.43,-5.1,.52,.52,.05,C.grey);
cylinder(scene,5,1.47,-5.1,.08,.08,.07,C.gold);
box(scene,5.75,1.45,-4.7,.12,.45,.12,C.gold);

// Speakers
for(const x of [3.0,7.0]){
  box(scene,x,1.25,-5.1,.65,1.0,.6,C.black,{
    title:'Speaker',
    text:'A little louder, please. This is the soundtrack of your life.'
  });
  cylinder(scene,x,1.3,-4.77,.2,.2,.12,C.grey);
  cylinder(scene,x,1.65,-4.77,.11,.11,.1,C.grey);
}

// Sofa
box(scene,7.6,.55,-2.0,2.5,.8,1.3,C.purple,{
 title:'The listening sofa',
 text:'A designated spot for music, daydreaming and temporarily ignoring the entire world.'
});
box(scene,7.6,1.02,-2.0,2.5,.2,1.3,C.lilac);
box(scene,6.35,.9,-2.0,.3,.8,1.3,C.purple);
box(scene,8.85,.9,-2.0,.3,.8,1.3,C.purple);
box(scene,7.0,1.17,-2.35,.75,.25,.65,C.pink);
box(scene,8.1,1.17,-2.35,.75,.25,.65,C.blue);

// Guitar
const guitar=group(scene,3.0,0,-1.9);
ball(guitar,0,.65,0,.48,C.wood2,{
 title:'The guitar corner',
 text:'For all the feelings that need a melody.'
});
ball(guitar,0,1.0,0,.28,C.wood2);
box(guitar,0,1.55,0,.15,1.0,.15,C.darkWood);
box(guitar,0,2.1,0,.38,.25,.22,C.wood);

// Music wall art
box(scene,5,2.1,-6.31,2.6,1.15,.1,C.mauve,{
 title:'Your soundtrack',
 text:'May your life always have a song for every season.'
});
box(scene,5,2.1,-6.23,2.3,.9,.04,C.lilac);
for(let i=0;i<5;i++){
  box(scene,4.3+i*.32,2.1,-6.18,.08,.55,.04,C.white);
}

// --------------------------------------------------
// CAT HQ: CAT BEDS, SCRATCHING POST, BOWLS, TOYS
// --------------------------------------------------

rug(-5,4,8,4.8,C.mint);

// Cat bed
box(scene,-7.6,.35,3.6,1.8,.5,1.7,C.pink,{
 title:'The cat nap station',
 text:'Official headquarters for tiny paws, dramatic stretches and very important naps.'
});
box(scene,-7.6,.65,3.6,1.45,.15,1.35,C.white);

// Scratching post
cylinder(scene,-3.0,1.0,3.6,.25,.25,1.6,C.wood,{
 title:'The scratching post',
 text:'A very important piece of furniture. The sofa is absolutely not for scratching. Allegedly.'
});
cylinder(scene,-3.0,1.85,3.6,.58,.58,.16,C.pink);

// Food and water
cylinder(scene,-6.8,.18,5.8,.4,.4,.16,C.grey,{
 title:'The food bowl',
 text:'The most important meeting of the day.'
});
cylinder(scene,-5.4,.18,5.8,.4,.4,.16,C.blue,{
 title:'The water bowl',
 text:'Hydration is important, even for tiny supervisors.'
});
ball(scene,-4.2,.35,5.5,.3,C.gold,{
 title:'The cat toy',
 text:'A suspiciously small object that causes a suspiciously large amount of chaos.'
});

// Cat shelf
box(scene,-5,1.55,1.2,3.0,.18,.55,C.wood,{
 title:'The cat climbing shelf',
 text:'A viewing platform for supervising humans and judging their decisions.'
});
box(scene,-5,1.0,1.2,1.3,.9,.6,C.sage);
box(scene,-5,2.0,1.2,2.8,.12,.6,C.wood);

// Noticeboard
box(scene,-8.0,2.1,1.0,1.6,1.1,.12,C.sage,{
 title:'Cat HQ rules',
 text:'Naps are mandatory. Treats are a right. Humans are staff.'
});

// --------------------------------------------------
// CHAOS DEN: DESK, LAPTOP, BOOKS, BEANBAG
// --------------------------------------------------

rug(5,4,8,4.8,material('#f1dfc5'));

// Desk
box(scene,5,.65,2.2,3.8,.25,1.5,C.wood,{
 title:'The command centre',
 text:'For ambitious plans, late-night thoughts and tabs that will never be closed.'
});
box(scene,3.4,.32,2.2,.18,.7,.18,C.darkWood);
box(scene,6.6,.32,2.2,.18,.7,.18,C.darkWood);

// Laptop
box(scene,5,1.1,1.9,1.55,.95,.1,C.charcoal,{
 title:'The laptop',
 text:'Currently running on 47 open tabs and pure determination.'
});
box(scene,5,1.58,1.84,1.35,.72,.04,C.blue);

// Books
for(let i=0;i<3;i++){
  box(scene,3.1,.9+i*.18,2.1,.8,.15,.65,[C.pink,C.lilac,C.mint][i],{
    title:'A stack of books',
    text:'A little knowledge, a little chaos and a lot of bookmarks.'
  });
}

// Beanbag
ball(scene,7.6,.55,5.3,.9,C.purple,{
 title:'The chaos beanbag',
 text:'A soft landing place for all the beautifully chaotic thoughts.'
});
ball(scene,7.6,1.05,5.3,.55,C.lilac);

// Mystery object
box(scene,4,.3,5.7,.8,.3,.8,C.pink,{
 title:'The mystery object',
 text:'Nobody knows what this is. It has been here for months. We respect it.'
});

// Pinboard
box(scene,5,2.0,1.0,3.0,1.25,.12,C.rose,{
 title:'The wall of ideas',
 text:'Dream big. Make weird things. Never apologise for being a little too much.'
});
for(let i=0;i<4;i++){
  ball(scene,4+i*.65,2.0,1.08,.09,[C.gold,C.blue,C.mint,C.white][i]);
}

// --------------------------------------------------
// ROOFTOP BIRTHDAY TERRACE
// --------------------------------------------------

box(scene,0,-.05,11.5,19.5,.28,7.0,material('#ddc8e5'),{
 title:'The birthday rooftop',
 text:'The best place in the whole little world. This one is for celebrating you. Happy birthday!'
});
box(scene,0,.12,11.5,19.1,.08,6.7,C.pink);

// Rooftop railings
for(const x of [-9.4,9.4]){
  box(scene,x,.8,11.5,.16,1.4,6.5,C.white);
}
for(const z of [8.2,14.8]){
  box(scene,0,.8,z,18.8,1.4,.16,C.white);
}
for(let i=0;i<10;i++){
  box(scene,-8.5+i*1.9,.8,8.2,.08,1.3,.08,C.rose);
  box(scene,-8.5+i*1.9,.8,14.8,.08,1.3,.08,C.rose);
}

// Cake table
cylinder(scene,0,.75,11.5,1.65,1.65,.25,C.white,{
 title:'The birthday cake',
 text:'One more candle, one more year of being wonderfully, ridiculously you. Make a wish!'
});
cylinder(scene,0,1.05,11.5,1.05,1.05,.55,C.pink);
cylinder(scene,0,1.38,11.5,.88,.88,.16,C.cream);
cylinder(scene,0,1.55,11.5,.12,.12,.35,C.gold);
ball(scene,0,1.78,11.5,.18,C.yellow);

// Party sofa
box(scene,-5,.55,11.5,2.7,.75,1.25,C.purple,{
 title:'The party sofa',
 text:'Reserved for the birthday girl and her favourite people.'
});
box(scene,-5,1.0,11.5,2.7,.18,1.25,C.lilac);
box(scene,-6.35,.9,11.5,.25,.8,1.3,C.purple);
box(scene,-3.65,.9,11.5,.25,.8,1.3,C.purple);

// Gift table
box(scene,5,.5,11.5,2.4,.65,1.2,C.wood,{
 title:'The gift table',
 text:'A few little surprises, wrapped with an unreasonable amount of love.'
});
box(scene,4.5,1.0,11.5,.55,.35,.55,C.pink);
box(scene,5.4,1.0,11.5,.55,.35,.55,C.lilac);
box(scene,5,1.22,11.5,.12,.1,1.25,C.gold);

// Party lights
for(let i=0;i<7;i++){
  const x=-7+i*2.3;
  cylinder(scene,x,1.6,13.4,.08,.08,.65,C.rose);
  ball(scene,x,2.0,13.4,.22,[C.yellow,C.pink,C.blue,C.lilac][i%4]);
}

// Rooftop plants
function plant(x,z){
  cylinder(scene,x,.3,z,.4,.34,.55,C.rose);
  cylinder(scene,x,.65,z,.06,.06,.65,C.wood);
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5;
    const leaf=ball(scene,x+Math.cos(a)*.28,1.0,z+Math.sin(a)*.28,.23,C.sage);
    leaf.scale.set(.75,1.4,.75);
  }
}
plant(-8,13.5);
plant(8,13.5);

// --------------------------------------------------
// CUTE WANDERING CATS
// --------------------------------------------------

function makeCat(x,z,color,name){
  const g=group(scene,x,.12,z);
  const fur=material(color);
  const body=ball(g,0,.4,0,.46,fur,{
    title:name,
    text:'A tiny furry resident of this little world. Obviously the real owner of the house.'
  });
  body.scale.set(1.35,.8,.85);
  ball(g,.35,.75,0,.33,fur);

  for(const s of [-1,1]){
    const ear=new THREE.Mesh(new THREE.ConeGeometry(.15,.34,4),fur);
    ear.position.set(.18+s*.2,1.05,s*.19);
    g.add(ear);
    ball(g,.49,.79,s*.13,.045,C.black);
  }

  const tail=new THREE.Mesh(new THREE.TorusGeometry(.3,.065,7,14,Math.PI),fur);
  tail.position.set(-.45,.55,0);
  tail.rotation.z=Math.PI/2;
  g.add(tail);

  for(const s of [-1,1]){
    for(const zside of [-1,1]){
      box(g,s*.23,.16,zside*.18,.14,.3,.14,fur);
    }
  }

  cats.push({g,x,z,phase:Math.random()*6});
}

makeCat(-6.5,4.1,'#f1e1d3','Mochi');
makeCat(-4.1,5.0,'#77717d','The tiny supervisor');
makeCat(6.7,4.2,'#dcae85','The chaos agent');

// --------------------------------------------------
// HIDDEN STARS AND BIRTHDAY LETTER
// --------------------------------------------------

let starsFound=0;

function makeStar(x,y,z){
  const star=new THREE.Mesh(
    new THREE.OctahedronGeometry(.24,0),
    new THREE.MeshStandardMaterial({
      color:'#f5cf70',
      emissive:'#d7a53e',
      emissiveIntensity:.3,
      roughness:.4
    })
  );
  star.position.set(x,y,z);
  star.castShadow=true;
  star.userData.info={
    title:'You found a little star!',
    text:'A tiny sparkle for someone who makes the world brighter.'
  };
  star.userData.star=true;
  scene.add(star);
  clickable.push(star);
}

makeStar(-8.5,.5,-.5);
makeStar(8.4,.5,-.5);
makeStar(-8.3,.5,5.7);
makeStar(8.2,.5,5.7);

const letterButton=document.createElement('button');
letterButton.textContent='♡ Birthday letter';
letterButton.style.cssText='position:fixed;left:12px;bottom:55px;z-index:3;background:#fff8f3;color:#86677d;border:1px solid #e8cbd9;font-size:11px;padding:9px 13px;border-radius:20px;opacity:.65';
document.body.appendChild(letterButton);

function showMessage(title,text){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalText').textContent=text;
  document.getElementById('modal').style.display='block';
}

letterButton.onclick=()=>{

document.getElementById('modalClose').onclick=()=>{

// --------------------------------------------------
// CAMERA VIEWS FOR EACH ROOM
// --------------------------------------------------

const views={
  all:{pos:[23,25,30],target:[0,1,3]},
  bedroom:{pos:[-8,11,5],target:[-5,1,-3]},
  music:{pos:[8,11,5],target:[5,1,-3]},
  cats:{pos:[-8,11,12],target:[-5,1,4]},
  chaos:{pos:[8,11,12],target:[5,1,4]},
  roof:{pos:[12,12,22],target:[0,1,11]}
};

let cameraMove=null;

function setView(name){
  const v=views[name];
  if(!v)return;
  visited.add(name);
  document.querySelectorAll('#rooms button').forEach(b=>{
    b.classList.toggle('active',b.dataset.room===name);
  });
  cameraMove={
    start:performance.now(),
    duration:850,
    from:camera.position.clone(),
    to:new THREE.Vector3(...v.pos),
    targetFrom:controls.target.clone(),
    targetTo:new THREE.Vector3(...v.target)
  };
}

document.querySelectorAll('#rooms button').forEach(button=>{
  button.addEventListener('click',()=>setView(button.dataset.room));
});

document.getElementById('home').onclick=()=>setView('all');

// --------------------------------------------------
// OBJECT CLICKING
// --------------------------------------------------

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let startX=0,startY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
  startX=e.clientX;
  startY=e.clientY;
});

renderer.domElement.addEventListener('pointerup',e=>{
  if(Math.abs(e.clientX-startX)>9||Math.abs(e.clientY-startY)>9)return;

  pointer.x=e.clientX/innerWidth*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(clickable,false);

  if(!hits.length)return;

  const obj=hits[0].object;
  const info=obj.userData.info;
  if(!info)return;

  if(obj.userData.star&&!obj.userData.found){
    obj.userData.found=true;
    starsFound++;
    obj.visible=false;
    letterButton.style.opacity=starsFound===4?'1':'.8';
    letterButton.textContent=starsFound===4?'♡ Open your birthday letter':'♡ Birthday letter · '+starsFound+'/4';
    showMessage('A little star found! ✨',
      'You found star '+starsFound+' of 4. Keep exploring the house!');
    return;
  }

  showMessage(info.title,info.text);
});

// --------------------------------------------------
// RESIZE AND ANIMATION
// --------------------------------------------------

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));
  renderer.setSize(innerWidth,innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  cats.forEach(cat=>{
    cat.g.position.x=cat.x+Math.sin(t*.45+cat.phase)*.55;
    cat.g.position.z=cat.z+Math.cos(t*.4+cat.phase)*.4;
    cat.g.position.y=.12+Math.abs(Math.sin(t*2+cat.phase))*.06;
    cat.g.rotation.y=Math.sin(t*.45+cat.phase)*.25;
  });

  if(cameraMove){
    const p=Math.min(1,(performance.now()-cameraMove.start)/cameraMove.duration);
    const eased=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    camera.position.lerpVectors(cameraMove.from,cameraMove.to,eased);
    controls.target.lerpVectors(cameraMove.targetFrom,cameraMove.targetTo,eased);
    if(p>=1)cameraMove=null;
  }

  controls.update();
  renderer.render(scene,camera);
}

animate();
loading.style.display='none';

}catch(error){
  showError(error);
}
